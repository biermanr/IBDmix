name: UnitTests
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: CTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build

      - name: Build
        run: |
          mkdir build_tmp
          cd build_tmp
          cmake .. -DBUILD_TESTS=ON
          cmake --build .
          ctest
