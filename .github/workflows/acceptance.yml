name: AcceptanceTests
on: [push, pull_request, workflow_dispatch]

# TODO: generate_gt, generate_gt with tabs, population with mask, all with mask
# all with no mask, inclusive end and stats
jobs:
  acceptance_tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test_type: [gen_20, populations, all_mask, all_no_mask, extra]

    steps:
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.16.x'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates

      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build
          cmake --version

      - name: Build
        run: |
          cmake --build ${{github.workspace}}/build

      - name: ${{ matrix.test_type }}
        working-directory: ${{github.workspace}}
        run: |
          ./scripts/acceptance_test.sh ${{ matrix.test_type }}
